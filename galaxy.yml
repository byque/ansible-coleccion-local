### REQUERIDO
# El espacio de nombre de la colección en el que vive todo el contenido. Solo puede contener caracteres alfanuméricos
# en minúscula y guion bajo. El espacio de nombre no puede comenzar con guion bajo ni números y no puede tener guiones
# bajos consecutivos.
namespace: byque

# El nombre de la colección. Tiene las mismas restricciones que el espacio de nombre.
name: local

# La versión de la colección. Debe ser compatible con versionamiento semántico.
version: 0.0.3

# La ruta al léeme en archivo Markdown (.md). Esta ruta es relativa a la raíz de la colección.
# El nombre del archivo se mantiene en inglés para su correcta visualización en GitHub.
readme: README.md

# Lista de los autores del contenido de la colección. Puede ser solo el nombre o en el formato
# 'Nombre Completo <email> (url)
# @nicks:irc/im.site#channel'
authors:
- your name <example@domain.com>


### OPTIONAL but strongly recommended
# A short summary description of the collection
description: your collection description

# Either a single license or a list of licenses for content inside of a collection. Ansible Galaxy currently only
# accepts L(SPDX,https://spdx.org/licenses/) licenses. This key is mutually exclusive with 'license_file'
license:
- GPL-2.0-or-later

# The path to the license file for the collection. This path is relative to the root of the collection. This key is
# mutually exclusive with 'license'
license_file: ''

# A list of tags you want to associate with the collection for indexing/searching. A tag name has the same character
# requirements as 'namespace' and 'name'
tags: []

# Collections that this collection requires to be installed for it to be usable. The key of the dict is the
# collection label 'namespace.name'. The value is a version range
# L(specifiers,https://python-semanticversion.readthedocs.io/en/latest/#requirement-specification). Multiple version
# range specifiers can be set and are separated by ','
dependencies: {}

# The URL of the originating SCM repository
repository: http://example.com/repository

# The URL to any online docs
documentation: http://docs.example.com

# The URL to the homepage of the collection/project
homepage: http://example.com

# The URL to the collection issue tracker
issues: http://example.com/issue/tracker

# Una lista de patrones de archivo tipo glob usados para filtrar cualquier archivo o directorio que no se debería
# incluir en el artefacto construído. Un patrón coincide con la ruta relativa del archivo o directorio con respecto al
# directorio de la colección. Esto usa 'fnmatch' para emparejar los archivos o directorios. Algunos directorios y
# archivos como 'galaxy.yml', '*.pyc', '*.retry' y '.git' siempre están filtrados. Mutuamente excluyente con 'manifest'
build_ignore:
- .idea
- .venv

# A dict controlling use of manifest directives used in building the collection artifact. The key 'directives' is a
# list of MANIFEST.in style
# L(directives,https://packaging.python.org/en/latest/guides/using-manifest-in/#manifest-in-commands). The key
# 'omit_default_directives' is a boolean that controls whether the default directives are used. Mutually exclusive
# with 'build_ignore'
# manifest: null

