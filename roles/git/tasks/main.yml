---
- name: "Configuración"
  ansible.builtin.debug:
    msg: "{{ _git_config }}"

- name: Instalar Git desde Advanced Package Tool
  become: yes
  ansible.builtin.apt:
    name: git
    state: present

- name: Generar la configuración de Git
  ansible.builtin.template:
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    src: gitconfig.j2
